<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="emBase" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F7FA"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="emHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EDF2F7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
  </defs>

  <!-- Outer Girdle (Octagonal Rectangle) -->
  <polygon points="38,15 82,15 95,28 95,92 82,105 38,105 25,92 25,28" fill="url(#emBase)" stroke="#1E232B" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Step 1 (Outer Step) -->
  <polygon points="41,22 79,22 89,32 89,88 79,98 41,98 31,88 31,32" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <!-- Corner Bevel Lines Step 1 -->
  <line x1="38" y1="15" x2="41" y2="22" stroke="#1E232B" stroke-width="1"/>
  <line x1="82" y1="15" x2="79" y2="22" stroke="#1E232B" stroke-width="1"/>
  <line x1="95" y1="28" x2="89" y2="32" stroke="#1E232B" stroke-width="1"/>
  <line x1="95" y1="92" x2="89" y2="88" stroke="#1E232B" stroke-width="1"/>
  <line x1="82" y1="105" x2="79" y2="98" stroke="#1E232B" stroke-width="1"/>
  <line x1="38" y1="105" x2="41" y2="98" stroke="#1E232B" stroke-width="1"/>
  <line x1="25" y1="92" x2="31" y2="88" stroke="#1E232B" stroke-width="1"/>
  <line x1="25" y1="28" x2="31" y2="32" stroke="#1E232B" stroke-width="1"/>

  <!-- Step 2 (Mid Step) -->
  <polygon points="44,28 76,28 83,35 83,85 76,92 44,92 37,85 37,35" fill="url(#emHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <!-- Corner Bevel Lines Step 2 -->
  <line x1="41" y1="22" x2="44" y2="28" stroke="#1E232B" stroke-width="1"/>
  <line x1="79" y1="22" x2="76" y2="28" stroke="#1E232B" stroke-width="1"/>
  <line x1="89" y1="32" x2="83" y2="35" stroke="#1E232B" stroke-width="1"/>
  <line x1="89" y1="88" x2="83" y2="85" stroke="#1E232B" stroke-width="1"/>
  <line x1="79" y1="98" x2="76" y2="92" stroke="#1E232B" stroke-width="1"/>
  <line x1="41" y1="98" x2="44" y2="92" stroke="#1E232B" stroke-width="1"/>
  <line x1="31" y1="88" x2="37" y2="85" stroke="#1E232B" stroke-width="1"/>
  <line x1="31" y1="32" x2="37" y2="35" stroke="#1E232B" stroke-width="1"/>

  <!-- Center Table -->
  <polygon points="48,35 72,35 77,40 77,80 72,85 48,85 43,80 43,40" fill="#FFFFFF" stroke="#1E232B" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Corner Bevel Lines into Table -->
  <line x1="44" y1="28" x2="48" y2="35" stroke="#1E232B" stroke-width="1"/>
  <line x1="76" y1="28" x2="72" y2="35" stroke="#1E232B" stroke-width="1"/>
  <line x1="83" y1="35" x2="77" y2="40" stroke="#1E232B" stroke-width="1"/>
  <line x1="83" y1="85" x2="77" y2="80" stroke="#1E232B" stroke-width="1"/>
  <line x1="76" y1="92" x2="72" y2="85" stroke="#1E232B" stroke-width="1"/>
  <line x1="44" y1="92" x2="48" y2="85" stroke="#1E232B" stroke-width="1"/>
  <line x1="37" y1="85" x2="43" y2="80" stroke="#1E232B" stroke-width="1"/>
  <line x1="37" y1="35" x2="43" y2="40" stroke="#1E232B" stroke-width="1"/>

  <!-- Specular Reflection -->
  <polygon points="48,35 60,35 55,60 43,60 43,40" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="52" cy="46" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
