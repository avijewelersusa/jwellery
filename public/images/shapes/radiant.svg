<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="radBase" cx="42%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F7FA"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="radHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EDF2F7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
  </defs>

  <!-- Outer Girdle (Octagonal Cut Corner Rectangle) -->
  <polygon points="38,16 82,16 94,28 94,92 82,104 38,104 26,92 26,28" fill="url(#radBase)" stroke="#1E232B" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Brilliant Radiating Corner Triangles -->
  <polygon points="38,16 60,34 26,28" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="82,16 60,34 94,28" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,92 60,86 82,104" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="26,92 60,86 38,104" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Side Facet Rays -->
  <polygon points="26,28 44,60 26,60" fill="url(#radHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="26,60 44,60 26,92" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,28 76,60 94,60" fill="url(#radHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,60 76,60 94,92" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Center Table (Octagon with Crushed Ice Facets) -->
  <polygon points="46,36 74,36 82,44 82,76 74,84 46,84 38,76 38,44" fill="#FFFFFF" stroke="#1E232B" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Radiant Inner Cross / X Pattern -->
  <line x1="38" y1="44" x2="82" y2="76" stroke="#1E232B" stroke-width="1"/>
  <line x1="38" y1="76" x2="82" y2="44" stroke="#1E232B" stroke-width="1"/>
  <polygon points="60,36 60,84 46,60 74,60" fill="url(#sparkle)" opacity="0.4"/>

  <!-- Top / Bottom Table Star Triangles -->
  <polygon points="46,36 74,36 60,48" fill="url(#radHighlight)" stroke="#1E232B" stroke-width="0.8"/>
  <polygon points="46,84 74,84 60,72" fill="url(#radHighlight)" stroke="#1E232B" stroke-width="0.8"/>

  <!-- Reflection -->
  <polygon points="46,36 58,36 52,56 38,56 38,44" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="50" cy="46" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
