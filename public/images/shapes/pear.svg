<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="pearBase" cx="42%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F7FA"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="pearHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EDF2F7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
  </defs>

  <!-- Pear Girdle Outline -->
  <!-- Top apex at (60, 15), flanks out to (24, 70) and (96, 70), bottom rounded curve via (60, 105) -->
  <path d="M 60,15 C 68,32 96,56 96,75 C 96,93 80,105 60,105 C 40,105 24,93 24,75 C 24,56 52,32 60,15 Z" fill="url(#pearBase)" stroke="#1E232B" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Top Point Star / Kite Facets -->
  <polygon points="60,15 54,34 60,40 66,34" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,15 44,40 54,34" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,15 76,40 66,34" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Side Triangular Facets -->
  <polygon points="24,75 42,56 46,72 34,78" fill="url(#pearHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="96,75 78,56 74,72 86,78" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Bottom Rounded Brilliant Facets -->
  <polygon points="60,105 48,92 60,88 72,92" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,105 72,92 86,96 78,103" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,105 48,92 34,96 42,103" fill="url(#pearHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Center Pear Table -->
  <path d="M 60,40 L 72,50 L 74,75 L 68,84 L 52,84 L 46,75 L 48,50 Z" fill="#FFFFFF" stroke="#1E232B" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Facet Connectors -->
  <line x1="60" y1="40" x2="48" y2="50" stroke="#1E232B" stroke-width="1"/>
  <line x1="60" y1="40" x2="72" y2="50" stroke="#1E232B" stroke-width="1"/>
  <line x1="72" y1="50" x2="78" y2="56" stroke="#1E232B" stroke-width="1"/>
  <line x1="48" y1="50" x2="42" y2="56" stroke="#1E232B" stroke-width="1"/>
  <line x1="74" y1="75" x2="86" y2="78" stroke="#1E232B" stroke-width="1"/>
  <line x1="46" y1="75" x2="34" y2="78" stroke="#1E232B" stroke-width="1"/>

  <!-- Reflection -->
  <polygon points="60,40 68,46 62,65 50,65 50,52" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="56" cy="52" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
