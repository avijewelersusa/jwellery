<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <radialGradient id="marqBase" cx="42%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F4F7FA"/>
      <stop offset="80%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </radialGradient>
    <linearGradient id="marqHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#EDF2F7" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D9E2EC"/>
    </linearGradient>
  </defs>

  <!-- Marquise Girdle (Two intersecting curved arcs) -->
  <path d="M 60,12 C 78,35 94,48 94,60 C 94,72 78,85 60,108 C 42,85 26,72 26,60 C 26,48 42,35 60,12 Z" fill="url(#marqBase)" stroke="#1E232B" stroke-width="1.6" stroke-linejoin="round"/>

  <!-- Top Sharp Tip Facets -->
  <polygon points="60,12 50,32 60,38 70,32" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,12 40,38 50,32" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,12 80,38 70,32" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Bottom Sharp Tip Facets -->
  <polygon points="60,108 50,88 60,82 70,88" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,108 40,82 50,88" fill="url(#marqHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="60,108 80,82 70,88" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Side Triangular Facets -->
  <polygon points="26,60 42,52 46,60 42,68" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,60 78,52 74,60 78,68" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Outer Girdle Side Triangles -->
  <polygon points="26,60 40,38 42,52" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="26,60 40,82 42,68" fill="url(#marqHighlight)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,60 80,38 78,52" fill="url(#sparkle)" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>
  <polygon points="94,60 80,82 78,68" fill="#FFFFFF" stroke="#1E232B" stroke-width="1" stroke-linejoin="round"/>

  <!-- Center Marquise Diamond Table (Hexagon) -->
  <polygon points="60,38 72,50 72,70 60,82 48,70 48,50" fill="#FFFFFF" stroke="#1E232B" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Reflection -->
  <polygon points="60,38 68,44 62,64 48,64 48,50" fill="#F8FAFC" opacity="0.8"/>
  <circle cx="56" cy="50" r="1.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
